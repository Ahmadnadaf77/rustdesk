name: Build Windows Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache Rust dependencies
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cache Flutter dependencies
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            flutter/.dart_tool
            flutter/.packages
            flutter/pubspec.lock
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # Setup Rust and Flutter in parallel
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: "stable"
          cache: true

      # Setup and install vcpkg dependencies
      - name: Setup vcpkg
        run: |
          # Clone vcpkg if it doesn't exist
          if (-not (Test-Path "C:\vcpkg\.git")) {
            Write-Host "Cloning vcpkg..."
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }

          # Checkout specific commit
          cd C:\vcpkg
          git fetch
          git checkout 120deac3062162151622ca4860575a33844ba10b

          # Bootstrap vcpkg
          Write-Host "Bootstrapping vcpkg..."
          .\bootstrap-vcpkg.bat

          Write-Host "vcpkg setup complete"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-installed-${{ hashFiles('vcpkg.json', '**/vcpkg.json') }}-${{ hashFiles('res/vcpkg/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-

      # Install vcpkg dependencies
      - name: Install vcpkg dependencies
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"

          Write-Host "Current directory: $(Get-Location)"

          # Check if vcpkg.json exists
          if (Test-Path "vcpkg.json") {
            Write-Host "Found vcpkg.json in root directory"
          } else {
            Write-Host "vcpkg.json not found, installing packages manually..."
          }

          # Ensure vcpkg is executable
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            Write-Host "ERROR: vcpkg.exe not found!"
            exit 1
          }

          # Install dependencies
          Write-Host "Installing vcpkg dependencies..."
          if (Test-Path "vcpkg.json") {
            C:\vcpkg\vcpkg install --triplet x64-windows-static
          } else {
            # Install common dependencies manually if vcpkg.json doesn't exist
            Write-Host "Installing dependencies manually..."
            C:\vcpkg\vcpkg install opus:x64-windows-static
            C:\vcpkg\vcpkg install libyuv:x64-windows-static
            C:\vcpkg\vcpkg install libvpx:x64-windows-static
            C:\vcpkg\vcpkg install libjpeg-turbo:x64-windows-static
          }

          # Integrate vcpkg
          Write-Host "Integrating vcpkg with build system..."
          C:\vcpkg\vcpkg integrate install

          # List installed packages
          Write-Host "Installed packages:"
          C:\vcpkg\vcpkg list --triplet x64-windows-static

      # Verify vcpkg installation
      - name: Verify vcpkg installation
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"

          Write-Host "=== VCPKG INSTALLATION VERIFICATION ==="

          # First check if vcpkg base directory exists
          if (-not (Test-Path "C:\vcpkg")) {
            Write-Host "ERROR: vcpkg root directory does not exist!"
            exit 1
          }
          Write-Host "✓ vcpkg root exists"

          # Check if installed directory exists at all
          if (-not (Test-Path "C:\vcpkg\installed")) {
            Write-Host "ERROR: vcpkg installed directory does not exist!"
            Write-Host "This usually means packages were not installed."
            Write-Host "Available directories in C:\vcpkg:"
            Get-ChildItem "C:\vcpkg" -Name
            exit 1
          }
          Write-Host "✓ Installed directory exists"

          # Verify triplet-specific installed directory exists
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static")) {
            Write-Host "ERROR: vcpkg installed directory for x64-windows-static does not exist!"
            Write-Host "Available triplets:"
            Get-ChildItem "C:\vcpkg\installed" -Name
            exit 1
          }
          Write-Host "✓ x64-windows-static directory exists"

          # Verify include directory exists
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\include")) {
            Write-Host "WARNING: Include directory does not exist!"
            Write-Host "Contents of x64-windows-static directory:"
            Get-ChildItem "C:\vcpkg\installed\x64-windows-static" -Name
          } else {
            Write-Host "✓ Include directory exists"
          }

          # Verify lib directory exists
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\lib")) {
            Write-Host "WARNING: Lib directory does not exist!"
          } else {
            Write-Host "✓ Lib directory exists"
          }

          # List all installed packages
          Write-Host "`nAll installed packages:"
          C:\vcpkg\vcpkg list --triplet x64-windows-static

          # Check for key packages
          Write-Host "`nKey packages:"
          C:\vcpkg\vcpkg list --triplet x64-windows-static | Select-String -Pattern "opus|libyuv|vpx|jpeg"

          # Check for opus headers if include dir exists
          if (Test-Path "C:\vcpkg\installed\x64-windows-static\include") {
            Write-Host "`nChecking for opus headers:"
            $opusHeaderPath = "C:\vcpkg\installed\x64-windows-static\include\opus\opus.h"
            if (Test-Path $opusHeaderPath) {
              Write-Host "✓ Opus headers found at: $opusHeaderPath"
            } else {
              Write-Host "WARNING: Opus headers not found at expected location!"
              Write-Host "Available include directories:"
              Get-ChildItem "C:\vcpkg\installed\x64-windows-static\include" -Name
            }
          }

          Write-Host "`n=== VCPKG VERIFICATION COMPLETE ===`n"

      # Patch Flutter
      - name: Patch Flutter
        run: |
          chmod +x ${{ github.workspace }}/.github/scripts/apply-flutter-patch.sh
          ${{ github.workspace }}/.github/scripts/apply-flutter-patch.sh "3.35.7" ${{ github.workspace }}/.github/patches/flutter_3.24.5_dropdown_menu_enableFilter.diff

      # Install Flutter dependencies and configure
      - name: Install Flutter dependencies
        run: |
          cd flutter
          flutter pub get
          flutter config --enable-windows-desktop
          flutter doctor

      # Install Flutter Rust Bridge (with caching)
      - name: Cache Flutter Rust Bridge
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen.exe
          key: ${{ runner.os }}-flutter-rust-bridge-1.80.1

      - name: Install Flutter Rust Bridge
        run: |
          if (-not (Test-Path "~/.cargo/bin/flutter_rust_bridge_codegen.exe")) {
            cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          }

      # Generate Flutter Rust Bridge and run build_runner in one step
      - name: Generate Flutter Rust Bridge and run build_runner
        run: |
          cd flutter
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./windows/runner/bridge_generated.h --skip-deps-check --no-build-runner
          flutter pub run build_runner build --delete-conflicting-outputs

      # Build Rust backend and Flutter app in parallel
      - name: Build Rust backend
        run: |
          # Set up Rust build environment for faster compilation
          $env:RUSTC_WRAPPER = ""
          $env:CARGO_INCREMENTAL = "1"
          $env:CARGO_NET_RETRY = "2"
          $env:CARGO_HTTP_TIMEOUT = "30"
          # Ensure vcpkg environment is properly set
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          # Set additional environment variables for opus
          $env:OPUS_STATIC = "1"
          $env:OPUS_DIR = "C:\vcpkg\installed\x64-windows-static"
          cargo build --release --jobs 2
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          OPUS_STATIC: 1
          OPUS_DIR: C:\vcpkg\installed\x64-windows-static

      - name: Build Windows Flutter app
        run: |
          cd flutter
          # Optimize Flutter build for faster compilation
          flutter build windows --release --verbose

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-build
          path: flutter/build/windows/x64/runner/Release/
          retention-days: 30

      - name: Create build info
        run: |
          echo "Build completed at: $(date)" > build_info.txt
          echo "Custom Server Configuration:" >> build_info.txt
          echo "ID Server: 171.22.24.28:21116" >> build_info.txt
          echo "API Server: https://171.22.24.28" >> build_info.txt
          echo "Public Key: 8HKCcJSQXbsgojo0gjrTg8uh7Kzfz+NS35lgIbWb0Vw=" >> build_info.txt
          echo "Build Version: 1.4.3+61" >> build_info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build_info.txt
          retention-days: 30

      - name: Create Windows Installer
        run: |
          # Create a simple installer package
          $buildDir = "flutter/build/windows/x64/runner/Release"
          $installerDir = "rustdesk-windows-installer"
          New-Item -ItemType Directory -Path $installerDir

          # Copy all files
          Copy-Item -Path "$buildDir/*" -Destination $installerDir -Recurse

          # Create a simple batch file to run RustDesk
          $batchContent = "@echo off`ncd /d `"%~dp0`"`nstart rustdesk.exe"
          $batchContent | Out-File -FilePath "$installerDir/Start RustDesk.bat" -Encoding ASCII

          # Create a zip file
          Compress-Archive -Path $installerDir -DestinationPath "rustdesk-windows-${{ github.run_number }}.zip"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-installer
          path: rustdesk-windows-${{ github.run_number }}.zip
          retention-days: 90

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: RustDesk Windows Release ${{ github.ref_name }}
          body: |
            ## RustDesk Windows Release ${{ github.ref_name }}

            ### What's New
            - Windows desktop application
            - Remote desktop functionality
            - File transfer capabilities
            - Audio/video streaming

            ### Installation
            1. Download the `rustdesk-windows-installer.zip` file
            2. Extract the zip file
            3. Run `Start RustDesk.bat` or double-click `rustdesk.exe`

            ### System Requirements
            - Windows 10 or later
            - 64-bit architecture

            ### Build Information
            - Build Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}
          files: |
            rustdesk-windows-${{ github.run_number }}.zip
          draft: false
          prerelease: false
