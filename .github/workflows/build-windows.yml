name: Build Windows Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache Rust dependencies
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cache Flutter dependencies
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            flutter/.dart_tool
            flutter/.packages
            flutter/pubspec.lock
          key: ${{ runner.os }}-flutter-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # Setup Rust and Flutter in parallel
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: "stable"
          cache: true

      # Setup and install vcpkg dependencies
      - name: Setup vcpkg
        run: |
          # Clone vcpkg if it doesn't exist
          if (-not (Test-Path "C:\vcpkg\.git")) {
            Write-Host "Cloning vcpkg..."
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          } else {
            Write-Host "vcpkg already exists, updating..."
          }

          # Checkout specific commit
          cd C:\vcpkg
          git fetch origin
          git checkout 120deac3062162151622ca4860575a33844ba10b

          # Clean any previous build artifacts
          if (Test-Path "buildtrees") { Remove-Item -Recurse -Force buildtrees -ErrorAction SilentlyContinue }
          if (Test-Path "packages") { Remove-Item -Recurse -Force packages -ErrorAction SilentlyContinue }
          if (Test-Path "downloads") { Remove-Item -Recurse -Force downloads -ErrorAction SilentlyContinue }

          # Bootstrap vcpkg
          Write-Host "Bootstrapping vcpkg..."
          .\bootstrap-vcpkg.bat -disableMetrics

          if (-not $?) {
            Write-Host "ERROR: vcpkg bootstrap failed!"
            exit 1
          }

          # Verify vcpkg version
          .\vcpkg version
          Write-Host "vcpkg setup complete"

      - name: Cache vcpkg buildtrees and downloads
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\buildtrees
            C:\vcpkg\downloads
            C:\vcpkg\packages
          key: ${{ runner.os }}-vcpkg-build-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('res/vcpkg/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-build-

      - name: Cache vcpkg installed packages
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-installed-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('res/vcpkg/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-installed-

      # Install vcpkg dependencies
      - name: Install vcpkg dependencies
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"

          # Get absolute paths
          $workspaceDir = $pwd.Path
          $manifestDir = $workspaceDir
          $overlayPortsDir = Join-Path $workspaceDir "res\vcpkg"

          Write-Host "=== VCPKG INSTALLATION START ==="
          Write-Host "Workspace directory: $workspaceDir"
          Write-Host "Manifest directory: $manifestDir"
          Write-Host "Overlay ports directory: $overlayPortsDir"
          Write-Host "Cache hit: ${{ steps.cache-vcpkg.outputs.cache-hit }}"
          Write-Host ""

          # Verify vcpkg.json exists
          $vcpkgJsonPath = Join-Path $manifestDir "vcpkg.json"
          if (-not (Test-Path $vcpkgJsonPath)) {
            Write-Host "ERROR: vcpkg.json not found at: $vcpkgJsonPath"
            exit 1
          }
          Write-Host "✓ Found vcpkg.json at: $vcpkgJsonPath"

          # Display vcpkg.json content
          Write-Host "`nvcpkg.json content:"
          Get-Content $vcpkgJsonPath | Write-Host
          Write-Host ""

          # Verify overlay ports directory
          if (-not (Test-Path $overlayPortsDir)) {
            Write-Host "ERROR: Overlay ports directory not found at: $overlayPortsDir"
            exit 1
          }
          Write-Host "✓ Found overlay ports directory"
          Write-Host "Available overlay ports:"
          Get-ChildItem $overlayPortsDir -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
          Write-Host ""

          # Verify vcpkg.exe
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            Write-Host "ERROR: vcpkg.exe not found!"
            exit 1
          }
          Write-Host "✓ vcpkg.exe found"
          Write-Host ""

          # Check if packages are already installed (from cache)
          $installedDir = "C:\vcpkg\installed\x64-windows-static"
          if (Test-Path $installedDir) {
            Write-Host "Checking cached packages..."
            try {
              $installedPackages = & C:\vcpkg\vcpkg list --triplet x64-windows-static 2>&1
              $packageCount = ($installedPackages | Measure-Object -Line).Lines
              
              if ($packageCount -gt 5) {
                Write-Host "Found $packageCount cached packages - cache is valid"
                Write-Host "Integrating cached vcpkg..."
                & C:\vcpkg\vcpkg integrate install
                Write-Host "=== VCPKG INSTALLATION COMPLETE (FROM CACHE) ==="
                exit 0
              } else {
                Write-Host "Cache appears incomplete ($packageCount packages), reinstalling..."
                Remove-Item -Recurse -Force $installedDir -ErrorAction SilentlyContinue
              }
            } catch {
              Write-Host "Error checking cache: $_"
              Write-Host "Will reinstall packages"
            }
          }

          # Install dependencies using manifest mode
          Write-Host "Installing vcpkg dependencies in manifest mode..."
          Write-Host "Command: vcpkg install --triplet x64-windows-static --x-manifest-root=$manifestDir --x-install-root=C:\vcpkg\installed"
          Write-Host ""

          # Change to workspace directory to ensure relative paths work
          cd $workspaceDir

          # Run vcpkg install in manifest mode with explicit paths
          # Note: PowerShell will automatically quote paths with spaces when using call operator
          $vcpkgArgs = @(
            "install"
            "--triplet"
            "x64-windows-static"
            "--x-manifest-root=$manifestDir"
            "--x-install-root=C:\vcpkg\installed"
            "--x-packages-root=C:\vcpkg\packages"
            "--overlay-ports=$overlayPortsDir"
            "--clean-after-build"
          )

          Write-Host "Executing vcpkg with arguments:"
          $vcpkgArgs | ForEach-Object { Write-Host "  $_" }
          Write-Host ""

          & C:\vcpkg\vcpkg $vcpkgArgs 2>&1 | Tee-Object -Variable vcpkgOutput
          $vcpkgExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "vcpkg install exit code: $vcpkgExitCode"
          Write-Host ""

          # Check installation result
          if ($vcpkgExitCode -ne 0) {
            Write-Host "ERROR: vcpkg install failed with exit code $vcpkgExitCode"
            Write-Host ""
            Write-Host "Last 50 lines of output:"
            $vcpkgOutput | Select-Object -Last 50 | Write-Host
            Write-Host ""
            exit 1
          }

          # Verify installed directory was created
          if (-not (Test-Path "C:\vcpkg\installed")) {
            Write-Host "ERROR: installed directory was not created!"
            Write-Host ""
            Write-Host "Contents of C:\vcpkg:"
            Get-ChildItem "C:\vcpkg" -Name
            Write-Host ""
            
            # Check for vcpkg-manifest-install.log
            $logPath = Join-Path $workspaceDir "vcpkg-manifest-install.log"
            if (Test-Path $logPath) {
              Write-Host "vcpkg manifest install log:"
              Get-Content $logPath | Write-Host
            }
            
            exit 1
          }
          Write-Host "✓ Installed directory created"
          Write-Host ""

          # Integrate vcpkg
          Write-Host "Integrating vcpkg with build system..."
          & C:\vcpkg\vcpkg integrate install
          Write-Host ""

          # List installed packages
          Write-Host "Successfully installed packages:"
          & C:\vcpkg\vcpkg list --triplet x64-windows-static
          Write-Host ""

          # Verify key packages
          Write-Host "Verifying key packages are installed:"
          $requiredPackages = @("opus", "libyuv", "libvpx", "libjpeg-turbo")
          foreach ($pkg in $requiredPackages) {
            $found = & C:\vcpkg\vcpkg list --triplet x64-windows-static | Select-String -Pattern $pkg
            if ($found) {
              Write-Host "  ✓ $pkg"
            } else {
              Write-Host "  ✗ $pkg (WARNING: not found)"
            }
          }

          Write-Host ""
          Write-Host "=== VCPKG INSTALLATION COMPLETE ==="

      # Verify vcpkg installation
      - name: Verify vcpkg installation
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"

          Write-Host "=== VCPKG INSTALLATION VERIFICATION ==="

          # First check if vcpkg base directory exists
          if (-not (Test-Path "C:\vcpkg")) {
            Write-Host "ERROR: vcpkg root directory does not exist!"
            exit 1
          }
          Write-Host "✓ vcpkg root exists"

          # Check if installed directory exists at all
          if (-not (Test-Path "C:\vcpkg\installed")) {
            Write-Host "ERROR: vcpkg installed directory does not exist!"
            Write-Host "This usually means packages were not installed."
            Write-Host "Available directories in C:\vcpkg:"
            Get-ChildItem "C:\vcpkg" -Name
            exit 1
          }
          Write-Host "✓ Installed directory exists"

          # Verify triplet-specific installed directory exists
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static")) {
            Write-Host "ERROR: vcpkg installed directory for x64-windows-static does not exist!"
            Write-Host "Available triplets:"
            Get-ChildItem "C:\vcpkg\installed" -Name
            exit 1
          }
          Write-Host "✓ x64-windows-static directory exists"

          # Verify include directory exists
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\include")) {
            Write-Host "WARNING: Include directory does not exist!"
            Write-Host "Contents of x64-windows-static directory:"
            Get-ChildItem "C:\vcpkg\installed\x64-windows-static" -Name
          } else {
            Write-Host "✓ Include directory exists"
          }

          # Verify lib directory exists
          if (-not (Test-Path "C:\vcpkg\installed\x64-windows-static\lib")) {
            Write-Host "WARNING: Lib directory does not exist!"
          } else {
            Write-Host "✓ Lib directory exists"
          }

          # List all installed packages
          Write-Host "`nAll installed packages:"
          C:\vcpkg\vcpkg list --triplet x64-windows-static

          # Check for key packages
          Write-Host "`nKey packages:"
          C:\vcpkg\vcpkg list --triplet x64-windows-static | Select-String -Pattern "opus|libyuv|vpx|jpeg"

          # Check for opus headers if include dir exists
          if (Test-Path "C:\vcpkg\installed\x64-windows-static\include") {
            Write-Host "`nChecking for opus headers:"
            $opusHeaderPath = "C:\vcpkg\installed\x64-windows-static\include\opus\opus.h"
            if (Test-Path $opusHeaderPath) {
              Write-Host "✓ Opus headers found at: $opusHeaderPath"
            } else {
              Write-Host "WARNING: Opus headers not found at expected location!"
              Write-Host "Available include directories:"
              Get-ChildItem "C:\vcpkg\installed\x64-windows-static\include" -Name
            }
          }

          Write-Host "`n=== VCPKG VERIFICATION COMPLETE ===`n"

      # Patch Flutter
      - name: Patch Flutter
        run: |
          chmod +x ${{ github.workspace }}/.github/scripts/apply-flutter-patch.sh
          ${{ github.workspace }}/.github/scripts/apply-flutter-patch.sh "3.35.7" ${{ github.workspace }}/.github/patches/flutter_3.24.5_dropdown_menu_enableFilter.diff

      # Install Flutter dependencies and configure
      - name: Install Flutter dependencies
        run: |
          cd flutter
          flutter pub get
          flutter config --enable-windows-desktop
          flutter doctor

      # Install Flutter Rust Bridge (with caching)
      - name: Cache Flutter Rust Bridge
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen.exe
          key: ${{ runner.os }}-flutter-rust-bridge-1.80.1

      - name: Install Flutter Rust Bridge
        run: |
          if (-not (Test-Path "~/.cargo/bin/flutter_rust_bridge_codegen.exe")) {
            cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          }

      # Generate Flutter Rust Bridge and run build_runner in one step
      - name: Generate Flutter Rust Bridge and run build_runner
        run: |
          cd flutter
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./windows/runner/bridge_generated.h --skip-deps-check --no-build-runner
          flutter pub run build_runner build --delete-conflicting-outputs

      # Build virtual display library first
      - name: Build virtual display library
        run: |
          cd libs/virtual_display/dylib
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          cargo build --release
          cd ../../..

      # Build Rust backend library (not binary!)
      - name: Build Rust backend library
        run: |
          # Set up Rust build environment for faster compilation
          $env:RUSTC_WRAPPER = ""
          $env:CARGO_INCREMENTAL = "1"
          $env:CARGO_NET_RETRY = "2"
          $env:CARGO_HTTP_TIMEOUT = "30"
          # Ensure vcpkg environment is properly set
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          # Set additional environment variables for opus
          $env:OPUS_STATIC = "1"
          $env:OPUS_DIR = "C:\vcpkg\installed\x64-windows-static"

          # Build the library (--lib flag is critical!)
          cargo build --features inline,flutter --lib --release --jobs 2

          # Verify the DLL was created
          if (-not (Test-Path "target/release/librustdesk.dll")) {
            Write-Host "ERROR: librustdesk.dll was not created!"
            exit 1
          }
          Write-Host "✓ librustdesk.dll created successfully"

          # Verify virtual display DLL exists
          if (-not (Test-Path "target/release/deps/dylib_virtual_display.dll")) {
            Write-Host "ERROR: dylib_virtual_display.dll was not found!"
            exit 1
          }
          Write-Host "✓ dylib_virtual_display.dll found"
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          OPUS_STATIC: 1
          OPUS_DIR: C:\vcpkg\installed\x64-windows-static

      - name: Build Windows Flutter app
        run: |
          cd flutter
          # Optimize Flutter build for faster compilation
          flutter build windows --release --verbose

      - name: Copy required DLLs to Flutter build output
        run: |
          $buildDir = "flutter/build/windows/x64/runner/Release"

          # Copy librustdesk.dll
          Copy-Item "target/release/librustdesk.dll" -Destination $buildDir
          Write-Host "✓ Copied librustdesk.dll"

          # Copy virtual display DLL
          Copy-Item "target/release/deps/dylib_virtual_display.dll" -Destination $buildDir
          Write-Host "✓ Copied dylib_virtual_display.dll"

          # List all DLLs in the build directory for verification
          Write-Host "`nDLLs in build directory:"
          Get-ChildItem $buildDir -Filter "*.dll" | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-build
          path: flutter/build/windows/x64/runner/Release/
          retention-days: 30

      - name: Create build info
        run: |
          echo "Build completed at: $(date)" > build_info.txt
          echo "Custom Server Configuration:" >> build_info.txt
          echo "ID Server: 171.22.24.28:21116" >> build_info.txt
          echo "API Server: https://171.22.24.28" >> build_info.txt
          echo "Public Key: 8HKCcJSQXbsgojo0gjrTg8uh7Kzfz+NS35lgIbWb0Vw=" >> build_info.txt
          echo "Build Version: 1.4.3+61" >> build_info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build_info.txt
          retention-days: 30

      - name: Create Windows Installer
        run: |
          # Create a simple installer package
          $buildDir = "flutter/build/windows/x64/runner/Release"
          $installerDir = "rustdesk-windows-installer"
          New-Item -ItemType Directory -Path $installerDir

          # Copy all files
          Copy-Item -Path "$buildDir/*" -Destination $installerDir -Recurse

          # Create a simple batch file to run RustDesk
          $batchContent = "@echo off`ncd /d `"%~dp0`"`nstart rustdesk.exe"
          $batchContent | Out-File -FilePath "$installerDir/Start RustDesk.bat" -Encoding ASCII

          # Create a zip file
          Compress-Archive -Path $installerDir -DestinationPath "rustdesk-windows-${{ github.run_number }}.zip"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-installer
          path: rustdesk-windows-${{ github.run_number }}.zip
          retention-days: 90

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: RustDesk Windows Release ${{ github.ref_name }}
          body: |
            ## RustDesk Windows Release ${{ github.ref_name }}

            ### What's New
            - Windows desktop application
            - Remote desktop functionality
            - File transfer capabilities
            - Audio/video streaming

            ### Installation
            1. Download the `rustdesk-windows-installer.zip` file
            2. Extract the zip file
            3. Run `Start RustDesk.bat` or double-click `rustdesk.exe`

            ### System Requirements
            - Windows 10 or later
            - 64-bit architecture

            ### Build Information
            - Build Number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}
          files: |
            rustdesk-windows-${{ github.run_number }}.zip
          draft: false
          prerelease: false
