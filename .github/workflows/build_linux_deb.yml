name: Build Linux DEB Release

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]
    workflow_dispatch:

jobs:
    build-linux-deb:
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    zip g++ gcc git curl wget nasm yasm \
                    libgtk-3-dev clang libxcb-randr0-dev libxdo-dev \
                    libxfixes-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                    libasound2-dev libpulse-dev cmake make \
                    libclang-dev ninja-build \
                    libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                    libpam0g-dev pkg-config \
                    build-essential

            - name: Setup Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  target: x86_64-unknown-linux-gnu
                  override: true

            - name: Setup vcpkg
              uses: lukka/run-vcpkg@v11
              with:
                  vcpkgDirectory: ${{ github.workspace }}/vcpkg
                  vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
                  doNotCache: false

            - name: Install vcpkg dependencies
              run: |
                  export VCPKG_ROOT=${{ github.workspace }}/vcpkg
                  export VCPKG_DEFAULT_TRIPLET=x64-linux
                  $VCPKG_ROOT/vcpkg install --triplet x64-linux

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.27.0"
                  channel: "stable"

            - name: Patch Flutter
              run: |
                  chmod +x ${{ github.workspace }}/.github/scripts/apply-flutter-patch.sh
                  ${{ github.workspace }}/.github/scripts/apply-flutter-patch.sh "3.27.0" ${{ github.workspace }}/.github/patches/flutter_3.24.5_dropdown_menu_enableFilter.diff

            - name: Install Flutter dependencies
              run: |
                  cd flutter
                  flutter pub get
                  flutter pub run build_runner build --delete-conflicting-outputs
                  flutter config --enable-linux-desktop
                  flutter doctor

            - name: Install Flutter Rust Bridge
              run: |
                  cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked

            - name: Generate Flutter Rust Bridge
              run: |
                  chmod +x ${{ github.workspace }}/.github/scripts/generate-flutter-rust-bridge.sh
                  ${{ github.workspace }}/.github/scripts/generate-flutter-rust-bridge.sh flutter ../src/flutter_ffi.rs ./lib/generated_bridge.dart ./linux/runner/bridge_generated.h

            - name: Build Rust backend
              run: |
                  cargo build --release --features flutter
              env:
                  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
                  VCPKG_DEFAULT_TRIPLET: x64-linux

            - name: Build Flutter Linux app
              run: |
                  cd flutter
                  flutter build linux --release

            - name: Create DEB package structure
              run: |
                  # Create DEB package structure
                  mkdir -p rustdesk-deb/DEBIAN
                  mkdir -p rustdesk-deb/usr/bin
                  mkdir -p rustdesk-deb/usr/share/applications
                  mkdir -p rustdesk-deb/usr/share/pixmaps
                  mkdir -p rustdesk-deb/usr/share/rustdesk
                  mkdir -p rustdesk-deb/usr/lib/rustdesk

            - name: Copy application files
              run: |
                  # Copy Flutter build output
                  cp -r flutter/build/linux/x64/release/bundle/* rustdesk-deb/usr/share/rustdesk/

                  # Copy Rust library
                  cp target/release/liblibrustdesk.so rustdesk-deb/usr/lib/rustdesk/

                  # Create symlink for binary
                  ln -sf /usr/share/rustdesk/rustdesk rustdesk-deb/usr/bin/rustdesk

            - name: Create desktop file
              run: |
                  cat > rustdesk-deb/usr/share/applications/rustdesk.desktop << 'EOF'
                  [Desktop Entry]
                  Name=RustDesk
                  Comment=Remote Desktop Software
                  Exec=/usr/bin/rustdesk
                  Icon=rustdesk
                  Terminal=false
                  Type=Application
                  Categories=Network;RemoteAccess;
                  Keywords=remote;desktop;vnc;rdp;
                  EOF

            - name: Copy icons
              run: |
                  cp res/128x128.png rustdesk-deb/usr/share/pixmaps/rustdesk.png

            - name: Create control file
              run: |
                  cat > rustdesk-deb/DEBIAN/control << 'EOF'
                  Package: rustdesk
                  Version: 1.4.3-61
                  Section: net
                  Priority: optional
                  Architecture: amd64
                  Depends: libc6 (>= 2.17), libgtk-3-0 (>= 3.10), libx11-6, libxcb1, libxfixes3, libxrandr2, libasound2, libpulse0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0
                  Maintainer: RustDesk Team <info@rustdesk.com>
                  Description: RustDesk Remote Desktop Software
                   RustDesk is a remote desktop software that allows you to connect to and control remote computers.
                   It provides secure, fast, and easy-to-use remote access capabilities.
                   .
                   Features:
                   - Remote desktop control
                   - File transfer
                   - Audio/video streaming
                   - Cross-platform support
                   - Secure connections
                  EOF

            - name: Set permissions
              run: |
                  chmod 755 rustdesk-deb/usr/bin/rustdesk
                  chmod 644 rustdesk-deb/usr/share/applications/rustdesk.desktop
                  chmod 644 rustdesk-deb/usr/share/pixmaps/rustdesk.png
                  chmod 755 rustdesk-deb/usr/lib/rustdesk/liblibrustdesk.so

            - name: Build DEB package
              run: |
                  dpkg-deb --build rustdesk-deb rustdesk-1.4.3-61-amd64.deb

            - name: Upload DEB package
              uses: actions/upload-artifact@v4
              with:
                  name: rustdesk-linux-deb
                  path: rustdesk-1.4.3-61-amd64.deb
                  retention-days: 30

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: rustdesk-linux-build
                  path: flutter/build/linux/x64/release/bundle/
                  retention-days: 30

            - name: Create build info
              run: |
                  echo "Build completed at: $(date)" > build_info.txt
                  echo "Custom Server Configuration:" >> build_info.txt
                  echo "ID Server: 171.22.24.28:21116" >> build_info.txt
                  echo "API Server: https://171.22.24.28" >> build_info.txt
                  echo "Public Key: 8HKCcJSQXbsgojo0gjrTg8uh7Kzfz+NS35lgIbWb0Vw=" >> build_info.txt
                  echo "Build Version: 1.4.3+61" >> build_info.txt
                  echo "Architecture: amd64" >> build_info.txt
                  echo "Package: rustdesk-1.4.3-61-amd64.deb" >> build_info.txt

            - name: Upload build info
              uses: actions/upload-artifact@v4
              with:
                  name: build-info
                  path: build_info.txt
                  retention-days: 30

            - name: Create GitHub Release (on tag)
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  name: RustDesk Linux DEB Release ${{ github.ref_name }}
                  body: |
                      ## RustDesk Linux DEB Release ${{ github.ref_name }}

                      ### What's New
                      - Linux desktop application (DEB package)
                      - Remote desktop functionality
                      - File transfer capabilities
                      - Audio/video streaming
                      - GTK3-based interface

                      ### Installation
                      1. Download the `rustdesk-1.4.3-61-amd64.deb` file
                      2. Install using: `sudo dpkg -i rustdesk-1.4.3-61-amd64.deb`
                      3. Or use: `sudo apt install ./rustdesk-1.4.3-61-amd64.deb`

                      ### System Requirements
                      - Ubuntu 18.04+ or compatible Debian-based distribution
                      - 64-bit architecture (amd64)
                      - GTK3 libraries
                      - GStreamer for audio/video

                      ### Build Information
                      - Build Number: ${{ github.run_number }}
                      - Commit: ${{ github.sha }}
                      - Built: ${{ github.event.head_commit.timestamp }}
                  files: |
                      rustdesk-1.4.3-61-amd64.deb
                  draft: false
                  prerelease: false
